server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: trip-service-route
          uri: lb://TRIP-SERVICE
          predicates:
            - Path=/api/trips/**
        - id: user-service-route
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
        - id: group-service-route
          uri: lb://GROUP-SERVICE
          predicates:
            - Path=/api/groups/**
        - id: chat-service-route
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/api/chat/**
        - id: marketplace-service-route
          uri: lb://MARKETPLACE-SERVICE
          predicates:
            - Path=/api/marketplace/**


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
