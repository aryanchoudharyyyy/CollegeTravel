server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: trip-service-route
              uri: lb://trip-service
              predicates:
                - Path=/api/trips/**
            - id: internal-trip-route
              uri: lb://trip-service
              predicates:
                - Path=/api/internal/trips/**
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: internal-user-route
              uri: lb://user-service
              predicates:
                - Path=/api/internal/users/**

            - id: group-service-route
              uri: lb://group-service
              predicates:
                  - Path=/api/groups/**
            - id: internal-group-route
              uri: lb://group-service
              predicates:
                - Path=/api/internal/groups/**

            - id: chat-service-route
              uri: lb://chat-service
              predicates:
                - Path=/api/chat/**
            - id: marketplace-service-route
              uri: lb://marketplace-service
              predicates:
                - Path=/api/marketplace/**
            - id: internal-marketplace-route
              uri: lb://marketplace-service
              predicates:
                - Path=/api/internal/marketplace/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
