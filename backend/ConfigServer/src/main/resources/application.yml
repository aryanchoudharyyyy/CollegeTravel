server:
  address: 0.0.0.0
  port: 8888

spring:
  security:
    user:
      name: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}

  cloud:
    config:
      server:
        git:
          uri: https://github.com/aryanchoudharyyyy/config-repository.git
          default-label: main
          clone-on-start: true
          username: ${CONFIG_REPO_USERNAME}
          password: ${CONFIG_REPO_PASSWORD}